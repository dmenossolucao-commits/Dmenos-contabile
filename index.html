    <script>
      // Clean up any stale development service workers that could cause blank screens
      (function () {
        if ('serviceWorker' in navigator && (window.location.hostname === 'localhost' || window.location.hostname.includes('run.app'))) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              if (registrations[i].scope.indexOf(window.location.origin) !== -1) {
                registrations[i].unregister();
              }
            }
          }).catch(function () {});
        }
      })();
    </script>
