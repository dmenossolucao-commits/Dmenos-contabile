<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#043c2e" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />

  <!-- Inner Vault / Wallet Shield -->
  <g filter="url(#glow)">
    <!-- Base Wallet / Register shape -->
    <path d="M128 176 C128 152 148 132 172 132 L340 132 C364 132 384 152 384 176 L384 344 C384 368 364 388 340 388 L172 388 C148 388 128 368 128 344 Z" fill="#065f46" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Register Display / Top Flap -->
    <path d="M156 160 L356 160 C364 160 370 166 370 174 L370 200 L142 200 L142 174 C142 166 148 160 156 160 Z" fill="#022c22" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- Digital Display with R$ in Gold -->
    <text x="256" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#fbbf24" letter-spacing="2">R$ CONTRO</text>

    <!-- Cashier Drawer / Wallet Front -->
    <rect x="156" y="224" width="200" height="136" rx="16" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2" />

    <!-- Subtle Money Slot / Badge -->
    <rect x="180" y="248" width="152" height="14" rx="7" fill="#022c22" opacity="0.6" />

    <!-- Central Gold Coin with Emblem -->
    <circle cx="256" cy="304" r="32" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" />
    <path d="M246 304 L253 294 L266 294 L259 304 L267 314 L254 314 Z" fill="#043c2e" />
    <text x="256" y="312" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#043c2e">D</text>

    <!-- Financial Growth Trend Sparkles -->
    <circle cx="360" cy="144" r="6" fill="#fbbf24" />
    <circle cx="152" cy="144" r="6" fill="#fbbf24" />
  </g>
</svg>
